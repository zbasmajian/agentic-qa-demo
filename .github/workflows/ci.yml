name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install browser system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # test-results/.last-run.json (list of failed tests) is a hidden file; the healer needs it
          include-hidden-files: true
  heal:
    needs: e2e
    if: ${{ failure() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write, pull-requests: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.head_ref }}', fetch-depth: 2 }
      - name: Stop if last commit was already a heal
        id: guard
        run: |
          if git log -1 --pretty=%s | grep -q '^heal:'; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.guard.outputs.skip != 'true'
        run: npm ci
      - name: Cache Playwright browsers
        if: steps.guard.outputs.skip != 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (cache miss)
        if: steps.guard.outputs.skip != 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install browser system deps only (cache hit)
        if: steps.guard.outputs.skip != 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download e2e results (which tests failed)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with: { name: playwright-report, path: . }
      - if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow docs/healing-policy.md.
            The e2e job's failed tests are listed in test-results/.last-run.json.
            Run `npx playwright test --last-failed` to reproduce only those (don't
            re-run the whole suite while investigating), then use the
            playwright-test-healer agent to fix the failing tests. Only edit files under tests/, plus specs/*.md
            only to keep names in step with what you healed.
            Then run the full `npx playwright test` once to confirm. Commit as "heal: <summary>", push to
            this PR branch, and comment on PR #${{ github.event.pull_request.number }}
            listing each change. Flag any change to an assertion for human review.
          claude_args: |
            --max-turns 30
            --mcp-config .mcp.ci.json
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npx playwright:*),Bash(git:*),Bash(gh pr comment:*),mcp__playwright-test"

  kind-e2e:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: { IMAGE: 'agentic-qa-demo:${{ github.sha }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: helm/kind-action@v1
        with: { cluster_name: qa, config: k8s/kind-config.yaml }
      - run: docker build -t "$IMAGE" .
      - run: kind load docker-image "$IMAGE" --name qa
      - run: |
          sed "s|agentic-qa-demo:dev|$IMAGE|" k8s/app.yaml | kubectl apply -f -
          kubectl rollout status deployment/agentic-qa-demo --timeout=180s
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { BASE_URL: 'http://localhost:8080' }
      - if: failure()
        run: kubectl get pods -o wide && kubectl describe pods && kubectl logs deploy/agentic-qa-demo --all-containers

  # Publishes the image to GitHub Container Registry, only for commits on main
  # (after a PR is merged) and only after kind-e2e passed.
  publish:
    needs: kind-e2e
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentic-qa-demo:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/agentic-qa-demo:main
